<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>風之工程師 — 海陸風大解密</title>
  <meta name="description" content="給學生自己查出風怎樣形成的探究遊戲。寫出過程，90 分或以上過關。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23147a96'/%3E%3Cpath d='M10 36c8-10 14-10 22 0s14 10 22 0' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/game.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
          <circle cx="18" cy="18" r="18" fill="#147a96"/>
          <path d="M6 20c5-6 8-6 13 0s8 6 13 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div>
          <strong>風之工程師</strong>
          <small>海陸風探究</small>
        </div>
      </div>
      <div class="progress" id="progress"></div>
      <div class="tools">
        <button type="button" class="ghost" id="mute" aria-pressed="false">聲音開</button>
        <button type="button" class="ghost" id="restart">重來</button>
      </div>
    </header>

    <div id="sky">
      <svg id="world" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#79c0ea"/>
            <stop offset="0.55" stop-color="#d9f1fb"/>
            <stop offset="0.78" stop-color="#fbe3bc"/>
            <stop offset="1" stop-color="#f6d3a4"/>
          </linearGradient>
          <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5ec4dd"/>
            <stop offset="0.45" stop-color="#1f8eae"/>
            <stop offset="1" stop-color="#0f5f86"/>
          </linearGradient>
          <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b7d56a"/>
            <stop offset="1" stop-color="#5f9a3c"/>
          </linearGradient>
          <linearGradient id="heatGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb15a" stop-opacity="0"/>
            <stop offset="1" stop-color="#ff7a3c" stop-opacity="0.45"/>
          </linearGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0e2433" flood-opacity="0.18"/>
          </filter>
        </defs>

        <rect width="1200" height="680" fill="url(#skyGrad)"/>

        <g class="sun" transform="translate(168 128)">
          <g class="rays">
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(30)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(60)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(90)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(120)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(150)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(180)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(210)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(240)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(270)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(300)"/>
            <rect x="-3" y="-102" width="6" height="28" rx="3" fill="#ffd56a" transform="rotate(330)"/>
          </g>
          <circle class="halo" r="78"/>
          <circle class="sun-core" r="48"/>
          <circle class="sun-inner" r="22"/>
        </g>

        <g transform="translate(430 86)"><g class="cloud c1"><ellipse cx="0" cy="12" rx="52" ry="22"/><ellipse cx="34" cy="2" rx="36" ry="24"/><ellipse cx="-34" cy="8" rx="30" ry="18"/></g></g>
        <g transform="translate(760 124)"><g class="cloud c2"><ellipse cx="0" cy="10" rx="44" ry="18"/><ellipse cx="28" cy="0" rx="28" ry="18"/><ellipse cx="-26" cy="6" rx="24" ry="14"/></g></g>
        <g transform="translate(980 78)"><g class="cloud c3"><ellipse cx="0" cy="8" rx="36" ry="14"/><ellipse cx="22" cy="0" rx="20" ry="12"/></g></g>

        <path class="gull" d="M0 10 Q10 0 20 10 M20 10 Q30 0 40 10" fill="none" stroke="#234055" stroke-width="3" stroke-linecap="round"/>
        <path class="gull late" d="M0 10 Q8 2 16 10 M16 10 Q24 2 32 10" fill="none" stroke="#234055" stroke-width="2.4" stroke-linecap="round"/>

        <path d="M0 430 C180 360 320 390 470 430 L470 470 L0 470 Z" fill="#d7ebc4"/>
        <ellipse cx="980" cy="448" rx="110" ry="16" fill="#b7d39a"/>

        <path d="M520 455 C700 410 880 490 1200 445 L1200 680 L520 680 Z" fill="url(#seaGrad)"/>
        <ellipse cx="860" cy="560" rx="120" ry="12" fill="#ffffff" opacity="0.18"/>

        <g class="waves">
          <path d="M560 520 Q640 500 730 520 T900 520 T1080 520" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
          <path d="M600 575 Q700 555 820 575 T1040 575" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round"/>
          <path d="M640 630 Q760 612 900 632 T1120 628" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="4" stroke-linecap="round"/>
        </g>

        <g transform="translate(980 520)">
          <g class="boat">
            <path d="M0 24 Q48 52 108 24 L92 24 Q52 40 14 24 Z" fill="#f7f3ea"/>
            <path d="M12 24 Q52 40 92 24 L80 24 Q52 34 22 24 Z" fill="#e08a45"/>
            <rect x="50" y="4" width="4" height="22" rx="1" fill="#6d4a32"/>
            <path d="M54 6 L84 20 L54 20 Z" fill="#fffaf3"/>
          </g>
        </g>

        <path d="M0 520 C170 445 310 480 455 525 C545 558 620 615 710 680 L0 680 Z" fill="url(#landGrad)"/>
        <path class="heat-wash" d="M40 560 C180 500 320 530 470 590 C390 640 200 670 40 680 Z" fill="url(#heatGrad)"/>
        <path d="M390 560 C500 530 590 590 690 680 L430 680 C430 640 390 600 360 590 Z" fill="#f0d7ad"/>
        <path d="M430 575 C520 555 590 610 670 675" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>

        <g filter="url(#soft)">
          <g transform="translate(78 455)">
            <g class="tree">
              <rect x="18" y="58" width="10" height="42" rx="3" fill="#6d4a32"/>
              <circle cx="23" cy="48" r="28" fill="#2f7d46"/>
              <circle cx="4" cy="58" r="16" fill="#3f9456"/>
              <circle cx="40" cy="60" r="15" fill="#246b3d"/>
            </g>
          </g>
          <g transform="translate(196 470)">
            <g class="tree b">
              <rect x="16" y="50" width="9" height="36" rx="3" fill="#6d4a32"/>
              <circle cx="20" cy="42" r="24" fill="#348752"/>
              <circle cx="4" cy="50" r="13" fill="#49a062"/>
            </g>
          </g>
          <g transform="translate(300 488)">
            <path d="M-4 28 L34 4 L74 28 Z" fill="#c4533d"/>
            <rect x="4" y="28" width="62" height="36" fill="#f7f1e6"/>
            <rect x="28" y="42" width="14" height="22" fill="#6d4a32"/>
            <rect x="12" y="36" width="10" height="10" fill="#f4d35e"/>
            <rect x="48" y="36" width="10" height="10" fill="#f4d35e"/>
          </g>
        </g>

        <g transform="translate(500 390)">
          <polygon class="beam" points="36,28 210,0 210,70" fill="rgba(255,214,120,.38)"/>
          <polygon points="10,168 22,36 50,36 62,168" fill="#f7f4ee"/>
          <polygon points="16,96 24,70 48,70 56,96" fill="#e25b45"/>
          <polygon points="16,132 24,112 48,112 56,132" fill="#e25b45"/>
          <rect x="16" y="28" width="40" height="20" rx="2" fill="#f4d35e"/>
          <circle class="lantern-glow" cx="36" cy="38" r="7" fill="#fff6d4"/>
          <path d="M12 28 H60 L52 12 H20 Z" fill="#c4473a"/>
          <rect x="30" y="138" width="12" height="22" fill="#6d4a32"/>
        </g>

        <g fill="#6f9a45">
          <ellipse cx="70" cy="620" rx="16" ry="6"/>
          <ellipse cx="140" cy="640" rx="12" ry="5"/>
          <ellipse cx="250" cy="650" rx="18" ry="6"/>
        </g>
      </svg>

      <canvas id="air"></canvas>
      <button type="button" id="sun-btn" aria-label="加熱陸地"></button>
      <div class="tag" id="tag-land">陸地</div>
      <div class="tag" id="tag-sea">海洋</div>
      <div class="badge low" id="badge-low"><small>陸地</small>低氣壓</div>
      <div class="badge high" id="badge-high"><small>海洋</small>高氣壓</div>

      <div id="drops" hidden>
        <div class="drop" data-slot="hot" tabindex="0">
          <span class="drop-label">靠近陸地</span>
          <div class="drop-well"><span class="drop-hint">拖到這裡</span></div>
        </div>
        <div class="drop" data-slot="wind" tabindex="0">
          <span class="drop-label">風的路徑</span>
          <div class="drop-well"><span class="drop-hint">拖到這裡</span></div>
        </div>
        <div class="drop" data-slot="cold" tabindex="0">
          <span class="drop-label">靠近海洋</span>
          <div class="drop-well"><span class="drop-hint">拖到這裡</span></div>
        </div>
      </div>
    </div>

    <section id="coach">
      <p class="kicker" id="kicker"></p>
      <h2 id="prompt" tabindex="-1"></h2>
      <p class="lead" id="lead"></p>
      <p id="feedback" role="status"></p>
      <div id="choices" class="choices"></div>
      <div id="order" hidden></div>
      <form id="answer-form" hidden>
        <div class="answer-head">
          <label for="answer">你的句子</label>
          <button type="button" id="voice-btn" class="voice-btn" aria-pressed="false" aria-controls="answer">語音輸入</button>
        </div>
        <textarea id="answer" maxlength="160" placeholder="例如：空氣受熱之後……"></textarea>
        <p id="voice-tip" class="fine" hidden aria-live="polite"></p>
        <p class="fine">90 分或以上過關。句子只在這部裝置評分，不會上傳。</p>
        <div class="form-row">
          <button class="primary" type="submit">交給 AI 評分</button>
          <button type="button" id="adapt-open" class="adapt-btn"><span>我已經嘗試很多次，</span><span>想用圖畫的方式再試一下</span></button>
        </div>
        <div id="result"></div>
        <p id="scaffold" hidden></p>
      </form>
      <div id="adapt" hidden>
        <div id="adapt-bank" class="bank" aria-label="答案卡片"></div>
        <button type="button" class="adapt-btn" id="adapt-close">改回打字</button>
      </div>
      <div id="actions"></div>
    </section>
  </div>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
